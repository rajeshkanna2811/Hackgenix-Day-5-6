
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="page">

        <!-- Website Header -->
        <header class="header">
            <h1>Travel Gallery</h1>
            <p>Explore beautiful destinations</p>
        </header>

        <!-- Sidebar Menu -->
        <aside class="sidebar">
            <h2>Menu</h2>

            <ul>
                <li>Beaches</li>
                <li>Mountains</li>
                <li>Cities.</li>
            </ul>
        </aside>

        <!-- Main Gallery -->
        <main class="gallery">

            <article class="card featured">
                <h3>Goa</h3>
                <p>Golden beaches</p>
            </article>

            <article class="card">
                <h3>Ooty</h3>
                <p>Misty hills</p>
            </article>

            <article class="card">
                <h3>Jaipur</h3>
                <p>Pink city</p>
            </article>

            <article class="card">
                <h3>Munnar</h3>
                <p>Tea gardens</p>
            </article>

            <article class="card">
                <h3>Kochi</h3>
                <p>Backwaters</p>
            </article>

            <article class="card">
                <h3>Shimla</h3>
                <p>Snow views</p>
            </article>

        </main>

        <!-- Website Footer -->
        <footer class="footer">
            <p>© 2026 Travel Gallery | Rajesh Kanna</p>
        </footer>

    </div>

</body>
</html>
