
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dash">

        <header class="top">
            <h1>Admin Dashboard</h1>
            <p>Welcome back!</p>
        </header>

        <nav class="side">
            <h2>Menu</h2>
            <ul>
                <li>Dashboard</li>
                <li>Customers</li>
                <li>Products</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </nav>

        <section class="stats">

            <div class="stat">
                <h3>Users</h3>
                <p>2,450</p>
            </div>

            <div class="stat">
                <h3>Sales</h3>
                <p>₹45,000</p>
            </div>

            <div class="stat">
                <h3>Orders</h3>
                <p>320</p>
            </div>

            <div class="stat">
                <h3>Profit</h3>
                <p>₹18,500</p>
            </div>

        </section>

        <section class="chart1">
            <h2>Chart A - Monthly Sales</h2>

            <div class="bars">
                <div style="height: 40%"></div>
                <div style="height: 65%"></div>
                <div style="height: 50%"></div>
                <div style="height: 85%"></div>
                <div style="height: 70%"></div>
            </div>
        </section>

        <section class="chart2">
            <h2>Chart B - User Growth</h2>

            <div class="bars">
                <div style="height: 30%"></div>
                <div style="height: 55%"></div>
                <div style="height: 45%"></div>
                <div style="height: 75%"></div>
                <div style="height: 95%"></div>
            </div>
        </section>

    </div>

</body>
</html>
